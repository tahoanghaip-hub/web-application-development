name: novelstudio
x-service: &service
  restart: unless-stopped
  networks: [private]
  depends_on:
    db: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 8
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?configure .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?configure .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
  identity:
    <<: *service
    build: ./services/identity
    environment:
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?configure .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
  studio:
    <<: *service
    build: ./services/studio
    environment:
      DB_PASSWORD: ${STUDIO_DB_PASSWORD:?configure .env}
  gateway:
    build:
      context: ./frontend
      dockerfile: ../gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    networks: [edge, private]
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  edge: {}
  private: {internal: true}
volumes:
  pgdata: {}
